# 로컬 개발용: PostgreSQL
#   docker compose up -d db
#   backend/server/.env 의 DATABASE_URL=postgresql+psycopg://chainbuy:chainbuy@localhost:5432/chainbuy
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chainbuy
      POSTGRES_PASSWORD: chainbuy
      POSTGRES_DB: chainbuy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainbuy"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
