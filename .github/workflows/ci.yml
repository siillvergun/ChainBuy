# 테스트 워크플로 (배포 없음)
# 흐름: 컨트랙트 테스트 · ABI 동기화 확인 / 백엔드 단위 테스트 · mock 기동 확인 / 프론트 lint · build / 체인 + API 스모크 테스트
# 배포는 Render(API·mock)와 Vercel(웹)이 main 푸시를 받아 각자 진행한다 (DEPLOY.md)
name: "[CI] Test"

on:
  # main으로 가는 PR에 커밋이 올라올 때마다 테스트 → 머지 전에 깨진 코드를 잡음
  pull_request:
    branches: [ "main" ]

  # PR이 main에 머지되면 main에서 한 번 더 실행 → 기본 브랜치에서만 npm·pip 캐시가 저장되므로 여기서 캐시를 갱신
  push:
    branches: [ "main" ]

  # 매주 월요일 03:00(KST)에 실행 → GitHub 캐시는 7일간 안 쓰면 삭제되므로 PR이 뜸한 기간에도 캐시를 살려둠
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch: { }

# 워크플로가 GitHub 토큰으로 할 수 있는 권한. 코드 읽기만 허용
permissions:
  contents: read

# 같은 PR(또는 브랜치)에 새 커밋이 올라오면 이전 실행을 취소하고 최신 커밋만 테스트
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 컨트랙트 ──────────────────────────────────────────────
  contracts:
    # GitHub가 빌려주는 임시 Ubuntu 컴퓨터(러너). 실행할 때마다 새로 만들어지고 끝나면 사라진다
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain

    steps:
      # 레포 코드를 러너로 내려받음
      - uses: actions/checkout@v4

      # Node 20 설치 + npm 다운로드 캐시 (package-lock.json이 바뀌면 새로 받음)
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blockchain/package-lock.json

      # package-lock.json 그대로 설치 (버전이 PR마다 달라지지 않게)
      - name: Install dependencies
        run: npm ci

      # 컴파일 + 컨트랙트 테스트 (상태 전이 · 돈 계산 · 공격 차단)
      - name: Run contract tests
        run: npx hardhat test

      # 컨트랙트를 바꾸고 ABI 복사본(backend·mock·frontend) 갱신을 잊으면 실패
      # 고치는 법: blockchain에서 npm run sync:abi 후 커밋
      - name: Check ABI copies are in sync
        run: |
          npm run sync:abi
          git diff --exit-code -- ../backend/server/app/abi ../mock/app/abi ../frontend/src/lib/contracts.generated.ts

  # ── 백엔드 · mock ─────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Python 3.12 설치 (Dockerfile과 같은 버전) + pip 다운로드 캐시
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/server/requirements.txt
            mock/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/server/requirements.txt -r mock/requirements.txt

      # DB·체인 없이 돌아가는 단위 테스트 (로그인 서명 · JWT · 배송지 해시 · 링크 검증)
      - name: Run backend unit tests
        working-directory: backend/server
        run: pytest -q

      # 에이전트·mock 서버가 import 단계에서 깨지지 않는지 확인
      - name: Import agent and mock app
        run: |
          (cd backend/server && python -c "import app.main, app.agent.__main__")
          (cd mock && python -c "import app.main")

  # ── 프론트엔드 ────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint (타입 오류는 다음 단계 build에서 잡힘)
      - name: Lint
        run: npm run lint

      # 실제 배포와 같은 빌드. 환경 변수 없이 로컬 체인 설정으로 빌드된다
      - name: Build
        run: npm run build

  # ── 전체 흐름 스모크 테스트 ───────────────────────────────
  smoke:
    runs-on: ubuntu-latest

    # 테스트 중 필요한 PostgreSQL을 러너 옆에 컨테이너로 띄움 (docker-compose.yml과 같은 계정)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chainbuy
          POSTGRES_PASSWORD: chainbuy
          POSTGRES_DB: chainbuy
        ports:
          - 5432:5432
        # DB가 접속을 받을 수 있을 때까지 기다린 뒤 다음 단계로 넘어감
        options: >-
          --health-cmd "pg_isready -U chainbuy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # API가 읽는 설정. hardhat 공개 테스트 계정만 쓰므로 secrets가 필요 없음
    env:
      DATABASE_URL: postgresql+psycopg://chainbuy:chainbuy@localhost:5432/chainbuy
      RPC_URL: http://127.0.0.1:8545
      ENABLE_MOCK_OAUTH: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            blockchain/package-lock.json
            backend/smoke/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/server/requirements.txt

      - name: Install dependencies
        run: |
          (cd blockchain && npm ci)
          (cd backend/smoke && npm ci)
          pip install -r backend/server/requirements.txt

      # 로컬 체인을 백그라운드로 띄우고 RPC가 응답할 때까지 대기
      - name: Start local chain
        working-directory: blockchain
        run: |
          npx hardhat node > ../hardhat.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$RPC_URL" && break
            sleep 1
          done

      # 컨트랙트 배포 + 데모 공구 시드 (deployments/localhost.json 생성 → API가 주소를 읽음)
      - name: Deploy and seed contracts
        working-directory: blockchain
        run: |
          npm run deploy:local
          npm run seed:local

      # 테이블 생성 후 API를 백그라운드로 띄우고 /health가 응답할 때까지 대기
      - name: Start API
        working-directory: backend/server
        run: |
          alembic upgrade head
          uvicorn app.main:app --port 4000 > ../../api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && break
            sleep 1
          done

      # 판매자 신청 → 담당자 승인 → 상품·공구 → 외부 상품 제안 → 인플루언서 태그까지 HTTP로 검증
      - name: Run smoke tests
        working-directory: backend/smoke
        run: npm run smoke

      # 실패했을 때 원인을 볼 수 있게 체인·API 로그 출력
      - name: Show logs on failure
        if: failure()
        run: |
          echo "── API ──"; tail -n 100 api.log || true
          echo "── hardhat ──"; tail -n 50 hardhat.log || true
